name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node (for link checking)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Check Markdown links
        run: |
          npm init -y
          npm install markdown-link-check@^3 --no-audit --no-fund
          npx markdown-link-check "docs/**/*.md" -q || true
        # Note: link checker is informative; it does not currently fail the workflow by default.

      - name: Prepare docs site (Docsify)
        run: |
          rm -rf www || true
          mkdir -p www/docs
          # copy repo docs into site folder
          if [ -d docs ]; then cp -R docs/* www/docs/; fi

          # Create a Docsify-powered index at /docs/index.html so the docs are served at /docs
          cat > www/docs/index.html <<'HTML'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Project Docs</title>
              <link rel="stylesheet" href="https://unpkg.com/docsify/lib/themes/vue.css">
            </head>
            <body>
              <div id="app"></div>
              <script>
                window.$docsify = {
                  name: 'Project Docs',
                  repo: '',
                  loadSidebar: true,
                  subMaxLevel: 2,
                }
              </script>
              <script src="https://unpkg.com/docsify/lib/docsify.min.js"></script>
            </body>
          </html>
          HTML

          # If there is a README.md at docs/ root, make it the index for the docsify app
          if [ -f www/docs/README.md ]; then cp www/docs/README.md www/docs/_sidebar.md || true; fi

      - name: Upload CNAME to folder
        run: |
          echo "zaorinu.is-a.dev" > www/CNAME || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './www'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
