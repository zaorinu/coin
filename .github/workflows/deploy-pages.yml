name: Deploy compiled docs to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Generate OpenAPI (from code) and build compiled docs (ReDoc + marked)
        run: |
          set -e
          # generate openapi.yaml from code and schemas
          npm ci --no-audit --no-fund || true
          npm run docs:generate || true
          
          set -e
          rm -rf www || true
          mkdir -p www/docs

          # Build OpenAPI HTML using ReDoc (if present)
          if [ -f docs/openapi.yaml ]; then
            # Use flexible npx invocation (no strict version pin) to avoid ETARGET failures
            npx -y redoc-cli bundle docs/openapi.yaml -o www/docs/openapi.html
          fi

          # Convert API.md to HTML (if present)
          if [ -f docs/API.md ]; then
            npx -y marked@^5.0.0 docs/API.md -o www/docs/API.html
          fi

          # Copy other docs assets (images, raw markdown) so they are available
          cp -R docs/* www/docs/ || true

          # Minimal site index linking to compiled docs
          cat > www/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width,initial-scale=1" />
            <title>Project Docs</title>
            <style>
              body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:40px;color:#111}
              a{color:#0b63d6}
            </style>
          </head>
          <body>
            <h1>Project Documentation</h1>
            <ul>
              <li><a href="/docs/openapi.html">OpenAPI (ReDoc)</a></li>
              <li><a href="/docs/API.html">API Overview (HTML)</a></li>
            </ul>
          </body>
          </html>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './www'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
